<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <header class="app-header">
    <nav class="nav-bar">
      <button type="button" class="icon-btn" aria-label="Voltar" onclick="history.back()">
        <span class="material-symbols-outlined" style="font-size:22px">arrow_back</span>
      </button>
      <h1 class="nav-bar__title text-headline-md">Entrar</h1>
      <div class="avatar" aria-hidden="true">
        <span class="material-symbols-outlined" style="font-size:18px">person</span>
      </div>
    </nav>
  </header>

  <main class="app-main">
    <div class="form-shell">
      <div class="page-heading">
        <h2 class="page-heading__title text-headline-lg-mobile">Acesse sua conta</h2>
        <p class="page-heading__subtitle text-subheading">
          Bem-vindo de volta! Continue suas leituras e acesse sua biblioteca pessoal.
        </p>
      </div>

      <form class="login-form" id="loginForm" novalidate>

        <div class="field" id="emailField">
          <label class="field__label-row text-label-md" for="emailInput">
            <span>E-mail</span>
            <span class="field-error text-caption" id="emailError" role="alert">Insira um e-mail válido</span>
          </label>
          <div class="input-wrap">
            <input
              class="input text-body-md"
              type="email"
              id="emailInput"
              name="email"
              autocomplete="email"
              placeholder="exemplo@email.com"
              required
              aria-describedby="emailError"
            />
            <span class="input-wrap__icon material-symbols-outlined" style="font-size:20px" aria-hidden="true">mail</span>
          </div>
        </div>

        <div class="field" id="passwordField">
          <label class="field__label-row text-label-md" for="passwordInput">
            <span>Senha</span>
            <span class="field-error text-caption" id="passwordError" role="alert">Mínimo 6 caracteres</span>
          </label>
          <div class="input-wrap">
            <input
              class="input input--password text-body-md"
              type="password"
              id="passwordInput"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
              aria-describedby="passwordError"
            />
            <button type="button" class="input-toggle-btn" id="togglePasswordBtn" aria-label="Mostrar ou ocultar senha">
              <span class="material-symbols-outlined" style="font-size:20px" id="passwordEyeIcon">visibility</span>
            </button>
          </div>
        </div>

        <div class="utility-row">
          <label class="checkbox-field">
            <input class="checkbox-field__input" type="checkbox" id="rememberMeCheckbox" name="remember" />
            <span class="checkbox-field__box" aria-hidden="true">
              <span class="material-symbols-outlined">check</span>
            </span>
            <span class="checkbox-field__label text-label-sm">Lembrar-me</span>
          </label>
          <a class="link-muted text-label-sm" href="#forgot">Esqueci minha senha</a>
        </div>

        <button class="btn-primary text-interactive-cta" id="submitBtn" type="submit">
          <span id="btnText">Entrar</span>
          <span class="spinner" id="btnSpinner" role="status" aria-label="Carregando"></span>
        </button>
      </form>

      <div class="divider" role="separator">
        <div class="divider__line"></div>
        <span class="divider__label text-caption">ou</span>
      </div>

      <div class="social-login">
        <button type="button" class="btn-secondary text-interactive-cta" data-social="Google">
          <svg class="btn-secondary__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"/>
            <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"/>
            <path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"/>
            <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"/>
          </svg>
          <span>Continuar com Google</span>
        </button>

        <button type="button" class="btn-secondary text-interactive-cta" data-social="Apple">
          <svg class="btn-secondary__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.85.94-2.92-.93.04-2.07.63-2.73 1.4-.58.68-1.1 1.77-.96 2.83 1.04.08 2.11-.54 2.75-1.31z"/>
          </svg>
          <span>Continuar com Apple</span>
        </button>
      </div>

      <p class="signup-footer text-body-sm">
        Não tem uma conta?
        <a class="signup-footer__link text-interactive-cta" href="#signup">Cadastre-se</a>
      </p>

      <div class="toast" id="toastNotification" role="status" aria-live="polite">
        <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
        <span id="toastMessage">Sucesso!</span>
      </div>

    </div>
  </main>
  <script src="login.js"></script>
</body>
</html>
