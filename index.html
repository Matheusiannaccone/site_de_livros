<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Entrar</title>
</head>

<body>

    <main>

        <h1 id="titulo">Bem-vindo</h1>

        <div id="container">

            <div class="ornamento">❦</div>

            <p class="subtitulo">
                Entre para continuar sua leitura
            </p>


            <!-- E-mail -->

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
            >

            <p id="alert1"></p>


            <!-- Senha -->

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

            <p id="alert2"></p>


            <!-- Mensagem geral de login -->

            <p id="login-error"></p>


            <!-- Botão -->

            <button id="submit" type="button">
                Entrar
            </button>


            <!-- Cadastro -->

            <p id="cadastro-text">
                Ainda não possui uma conta?
                <a href="http://127.0.0.1:3000/index.html?vscode-livepreview=true">
                    Cadastre-se
                </a>
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
